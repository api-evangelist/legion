aid: legion
name: Legion Security
description: 'Legion Security is a browser-native AI SOC analyst that learns a security
  team''s real workflows from inside the browser and then helps execute and automate
  them in phases: Learning Mode captures and maps how analysts actually work, Guided
  Mode runs those workflows with a human in the loop, and Autonomous Mode takes over
  the steps the team has signed off on. The platform targets alert triage, investigation,
  and evidence gathering in the security operations center, positioning agentic AI
  as a dependable teammate rather than a black box, with every captured insight visible
  and every action explainable. Legion Security operates a SafeBase trust center and
  publishes SOC 2 Type 2, ISO/IEC 27001:2022, ISO/IEC 42001:2023, HIPAA, and CSA STAR
  Level 1 compliance documentation. The company is seed-stage and backed by Accel;
  it publishes no public developer API at this time.'
